<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Table Hover Test</title>
  <style>
    /* PAGE LAYOUT */
    body, html { overflow: auto; height: 100%; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    [id="T3057851291"].page { justify-content: flex-end; }
    [id="T3057851291"] .page-layout { max-width: 100%; }

    [id="T3057851291"] .page-layout {
        max-width: 100%;
        height: 100vh;
        padding: 0 !important;
    }

    [id="T3057851291"] .content_PvDj1 { height: 100%; }

    [id="T3057851291"] column-set {
        height: 100%;
        display: flex;
        align-items: stretch;
    }

    [id="T3057851291"] column-unit[slot="0"] {
        height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 100px;
        box-sizing: border-box;
        scrollbar-gutter: stable;
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
        width: 100%;
        padding: 20px;
    }
    [id="T3057851291"] column-unit[slot="0"]::-webkit-scrollbar { width: 4px; }
    [id="T3057851291"] column-unit[slot="0"]::-webkit-scrollbar-track { background: transparent; }
    [id="T3057851291"] column-unit[slot="0"]::-webkit-scrollbar-thumb { background: transparent; border-radius: 2px; }
    [id="T3057851291"] column-unit[slot="0"]:hover { scrollbar-color: rgba(0,0,0,0.25) transparent; }
    [id="T3057851291"] column-unit[slot="0"]:hover::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.25); }
    [id="T3057851291"] column-unit[slot="0"]::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.4); }

    /* ACTIVITY TABLE */
    [id="T3057851291"] .wy-tabs {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        flex-shrink: 0;
        margin: 0;
        padding: 0.6rem 0 0.7rem;
        border-bottom: 1px solid #e8e8e8;
        background: #ffffff;
    }

    [id="T3057851291"] .wy-tabs-row {
        display: flex;
        gap: 0.35rem;
        flex-wrap: wrap;
    }

    /* CLEAN TAB BUTTON STYLES MIGRATED FROM JS */
    [id="T3057851291"] .wy-tab {
        font-size: 0.65em !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        letter-spacing: 0.09em !important;
        text-transform: uppercase !important;
        font-weight: 400 !important;
        border-radius: 2rem !important;
        padding: 4px 8px !important;
        margin: 0 !important;
        cursor: pointer !important;
        line-height: 1 !important;
        box-shadow: none !important;
        background: transparent !important;
        border: 1px solid #ddd !important;
        color: #aaa !important;
        flex-shrink: 0 !important;
    }

    [id="T3057851291"] .wy-tab:hover {
        background: #111 !important;
        border-color: #111 !important;
        color: #f5f5f5 !important;
    }

    [id="T3057851291"] .wy-tab.active {
        background: #111 !important;
        border-color: #111 !important;
        color: #f5f5f5 !important;
    }

    /* Special sharp corner tab style for Initiatives button */
    [id="T3057851291"] .wy-tab[data-f="initiatives"] {
        border-radius: 0px !important;
    }

    [id="T3057851291"] .wy-tab[data-f="initiatives"]:hover {
        background: transparent !important;
        border: 1px solid #111 !important;
        color: #111 !important;
    }

    [id="T3057851291"] .wy-tab[data-f="initiatives"].active {
        background: #111 !important;
        border: 1px solid #111 !important;
        color: #f5f5f5 !important;
    }

    /* TABLE LAYOUT & STYLES */
    [id="T3057851291"] .wy-table {
        width: 100%;
        min-width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        margin-top: 10px;
    }

    [id="T3057851291"] .wy-table .c-date { width: 135px; }
    [id="T3057851291"] .wy-table .c-type { width: 110px; }

    [id="T3057851291"] .wy-table tr {
        position: relative;
        overflow: hidden;
        border-top: 1px solid #eee;
        background: transparent;
    }
    [id="T3057851291"] .wy-table tr.hidden { display: none !important; }

    [id="T3057851291"] .wy-table tr:hover { background: #111; }
    [id="T3057851291"] .wy-table tr:hover td,
    [id="T3057851291"] .wy-table tr:hover td span,
    [id="T3057851291"] .wy-table tr:hover td a,
    [id="T3057851291"] .wy-table tr:hover td a span { color: #f5f5f5 !important; }
    [id="T3057851291"] .wy-table tr:hover .wy-date span,
    [id="T3057851291"] .wy-table tr:hover .wy-type span { color: rgba(255,255,255,0.45) !important; }
    [id="T3057851291"] .wy-table tr:hover b,
    [id="T3057851291"] .wy-table tr:hover strong {
        letter-spacing: 0.015em;
        text-shadow: 0 0 8px rgba(255,255,255,0.3), 0 0 2px rgba(255,255,255,0.5);
    }

    [id="T3057851291"] .wy-table td {
        padding: 6px 6px 6px 0;
        vertical-align: top;
        overflow: hidden;
        box-sizing: border-box;
    }

    [id="T3057851291"] .wy-date { color: #aaa; padding-top: 7px; }
    [id="T3057851291"] .wy-table td.wy-date span,
    [id="T3057851291"] .wy-table td.wy-date span span { 
        font-size: 0.62em !important; 
        text-transform: uppercase !important; 
        letter-spacing: 0.05em !important; 
        white-space: nowrap;
    }

    [id="T3057851291"] .wy-desc { color: #111; line-height: 1.35; padding-top: 6px !important; }
    [id="T3057851291"] .wy-desc a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
    [id="T3057851291"] .wy-desc a:hover { border-bottom-color: currentColor; }

    [id="T3057851291"] .wy-type { text-align: right; color: #bbb; padding-top: 7px !important; white-space: nowrap !important; }
    [id="T3057851291"] .wy-table td.wy-type span { font-size: 0.62em !important; white-space: nowrap !important; }

    [id="T3057851291"] .wy-solo-marker {
        color: #e65100;
        margin-left: 2px;
        font-weight: bold;
        display: inline-block;
    }

    [id="T3057851291"] .wy-table tr:hover .wy-solo-marker {
        color: #ffcc80 !important;
    }

    @media screen and (max-width: 768px) {
        [id="T3057851291"] .wy-table .c-date {
            width: 85px !important;
        }
        [id="T3057851291"] .wy-table td.wy-date {
            width: 85px !important;
            min-width: 85px !important;
        }
        [id="T3057851291"] .wy-table td.wy-date span,
        [id="T3057851291"] .wy-table td.wy-date span span {
            font-size: 0.58em !important;
        }
        [id="T3057851291"] .wy-table .c-type {
            width: 75px !important;
        }
        [id="T3057851291"] .wy-table td.wy-type {
            width: 75px !important;
            min-width: 75px !important;
        }
        [id="T3057851291"] .wy-table td.wy-type span {
            font-size: 0.58em !important;
        }
        [id="T3057851291"] .wy-table td {
            padding: 5px 4px 5px 0 !important;
        }
    }
  </style>
</head>
<body>

  <div id="T3057851291">
    <column-unit slot="0">
      
      <!-- Tab filters -->
      <div id="wy-tabs" class="wy-tabs">
        <button class="wy-tab active" data-f="all">All</button>
        <button class="wy-tab" data-f="highlight">Highlights</button>
        <button class="wy-tab" data-f="exhibition">Exhibitions</button>
        <button class="wy-tab" data-f="talk">Talks</button>
        <button class="wy-tab" data-f="publication">Publications</button>
        <button class="wy-tab" data-f="editorial">Editorial</button>
        <button class="wy-tab" data-f="residency">Residencies</button>
      </div>

      <!-- Activity Table -->
      <table class="wy-table">
        <colgroup>
          <col class="c-date">
          <col>
          <col class="c-type">
        </colgroup>
      </table>

    </column-unit>
  </div>

  <!-- Load the script -->
  <script src="wy-table.js"></script>

</body>
</html>
